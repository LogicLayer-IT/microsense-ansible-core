---
- name: "System | Configure SNMPv3"
  ansible.netcommon.cli_command:
    command: |
      configure terminal
      snmp-server group monitor-group v3 priv
      snmp-server user {{ snmp_user }} monitor-group v3 auth {{ snmp_auth_protocol }} {{ snmp_auth_pass }} priv {{ snmp_priv_protocol }} {{ snmp_priv_pass }}
      snmp-server host {{ snmp_trap_address }} version 3 priv {{ snmp_user }}
      snmp-server enable traps
      exit
  no_log: false